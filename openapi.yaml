  # ------------------------------------------------------------------- events

  /masterdata/events:
    get:
      tags: [Events]
      summary: Receive master-data changes (Server-Sent Events)
      description: >
        A persistent SSE stream of master-data changes for the calling endpoint.
        agrirouter never echoes a change back to the endpoint it originated from.
        Because one stream carries every opted-in entity type, each event's `data`
        is an `Entity` — an `Organization`, `Customer`, `Farm`, `Field`, or
        `FieldBoundary` discriminated by its `type` property. Delivered objects
        carry this endpoint's own `localId` in `idMappings` when known.
      operationId: streamMasterdataEvents
      responses:
        '200':
          description: An event stream.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/Entity'
                description: >
                  The `data:` payload of each SSE frame. Frames carry an `event:`
                  of either `MASTERDATA_CHANGED` or `MASTERDATA_DEACTIVATED`.

  # ------------------------------------------------------------ configuration

  /endpoints/{externalEndpointId}/masterdata-config:
    parameters:
      - name: externalEndpointId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Configuration]
      summary: Get the endpoint's master-data opt-in configuration
      operationId: getMasterdataConfig
      responses:
        '200':
          description: The current configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterdataConfig'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Configuration]
      summary: Set the endpoint's master-data opt-in configuration
      description: >
        Configures per-entity opt-in and read/write direction. Master-data routes
        are created only through this explicit opt-in, never by default routing.
        Enabling reception of fields SHOULD also enable the organizations,
        customers, farms, and field boundaries those fields depend on.
      operationId: putMasterdataConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterdataConfig'
      responses:
        '200':
          description: Updated configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterdataConfig'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: oauth2
      description: OAuth 2.0 bearer tokens obtained via the Client Credentials flow.
      flows:
        clientCredentials:
          tokenUrl: https://api.prod.agrirouter.farm/oauth/token
          scopes:
            manage_endpoints: Configure endpoints and their master-data opt-in.
            masterdata: Send, request, and read synchronized master data.

  parameters:
    LocalId:
      name: localId
      in: path
      required: true
      description: >
        The sending participant's own identifier for the entity. Unique within
        the calling endpoint per entity type. A local identifier already mapped to
        a different canonical object is rejected (see the specification,
        "Identifier mapping").
      schema:
        type: string
    AgrirouterId:
      name: agrirouterId
      in: path
      required: true
      description: The agrirouter-assigned canonical identifier (UUID).
      schema:
        type: string
        format: uuid
    Active:
      name: active
      in: query
      description: If set, filters by active state.
      schema:
        type: boolean
    PageToken:
      name: pageToken
      in: query
      description: Opaque cursor returned by a previous call.
      schema:
        type: string
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100

  requestBodies:
    EntityRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EntityRequest'

  responses:
    RequestAccepted:
      description: >
        Request accepted; the entity will be delivered via the event stream if
        the caller is entitled to it.
    ValidationError:
      description: >
        The message failed hard validation against the master-data subset and was
        rejected without being applied or forwarded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: >
        The caller is not the owner of the endpoint, or is not opted in / not
        permitted to write the entity type.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such entity, or the caller is not entitled to it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MappingConflict:
      description: >
        The supplied local identifier is already mapped to a different canonical
        object (an asymmetric / n:1 mapping the caller must resolve).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
      required: [code, message]

    EntityRequest:
      type: object
      description: A lazy-loading request for a single canonical object.
      properties:
        agrirouterId:
          type: string
          format: uuid
          description: The canonical identifier of the wanted entity.
      required: [agrirouterId]

    EntityReference:
      type: object
      description: A reference to another entity by canonical and/or local id.
      properties:
        agrirouterId:
          type: string
          format: uuid
        localId:
          type: string
      anyOf:
        - required: [agrirouterId]
        - required: [localId]

    IdMapping:
      type: object
      description: One participant's local identifier for a canonical object.
      properties:
        endpointId:
          type: string
        localId:
          type: string
      required: [endpointId, localId]

    Envelope:
      type: object
      description: >
        Fields common to every master-data entity. The concrete entity type is
        determined by the path; each entity schema pins the `type` discriminator
        so that objects remain self-describing on the event stream.
      properties:
        agrirouterId:
          type: string
          format: uuid
          readOnly: true
          description: Canonical identifier, assigned by agrirouter. Absent on first send.
        localId:
          type: string
          description: The sending participant's own identifier for the entity.
        idMappings:
          type: array
          readOnly: true
          description: Maintained by agrirouter; ignored on send.
          items:
            $ref: '#/components/schemas/IdMapping'
        active:
          type: boolean
          default: true
        revision:
          type: integer
          readOnly: true
          description: Monotonic per-object counter maintained by agrirouter.
        modifiedAt:
          type: string
          format: date-time
          readOnly: true
        sourceEndpointId:
          type: string
          readOnly: true
        previousVersions:
          type: array
          description: References to entities this one supersedes (split / merge lineage).
          items:
            $ref: '#/components/schemas/EntityReference'
      required: [localId]

    PersonName:
      type: object
      description: A person name.
      properties:
        title:
          type: string
        firstName:
          type: string
        lastName:
          type: string
      required: [lastName]

    Address:
      type: object
      properties:
        street:
          type: string
        poBox:
          type: string
        postalCode:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          pattern: '^[A-Z]{2}$'

    Contact:
      type: object
      properties:
        phone:
          type: string
        mobile:
          type: string
        email:
          type: string
          format: email

    HarvestPeriod:
      type: object
      description: >
        Canonical harvest period as an interval. A discrete year is mapped to an
        interval on send; `label` may round-trip the native presentation.
      properties:
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
          description: Absent means open / current.
        label:
          type: string
          description: 'Human-facing designation, e.g. "2026" or "2025/2026".'
      required: [validFrom]

    Organization:
      description: >
        The structure of a farm or a group of several farms. Acts as the
        contractor in a contractor scenario; identical to the farm when a farmer
        has a single farm.
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              const: organization
              readOnly: true
              description: >
                Discriminator, set by agrirouter. Implied by the path on send.
            name:
              type: string
            address:
              $ref: '#/components/schemas/Address'
            contact:
              $ref: '#/components/schemas/Contact'
            billingAddress:
              $ref: '#/components/schemas/Address'
            taxNumber:
              type: string
              description: Identifier assigned by tax authorities.
            taxId:
              type: string
              description: Numerical identifier assigned by tax authorities.
            tradeId:
              type: string
              description: Numerical identifier assigned by public authorities.
            commercialRegistryNumber:
              type: string
              description: Identifier from the commercial register.
          required: [type, name]

    Customer:
      description: >
        An individual in charge of on-site farm operations — producing,
        harvesting, transporting, and storing a commodity, and overseeing asset
        and input usage.
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              const: customer
              readOnly: true
              description: >
                Discriminator, set by agrirouter. Implied by the path on send.
            name:
              $ref: '#/components/schemas/PersonName'
            address:
              $ref: '#/components/schemas/Address'
            contact:
              $ref: '#/components/schemas/Contact'
            billingAddress:
              $ref: '#/components/schemas/Address'
            taxNumber:
              type: string
              description: Identifier assigned by tax authorities.
            taxId:
              type: string
              description: Numerical identifier assigned by tax authorities.
            tradeId:
              type: string
              description: Numerical identifier assigned by public authorities.
            commercialRegistryNumber:
              type: string
              description: Identifier from the commercial register.
            specialisedUsageType:
              type: string
              description: >
                Specialised usage type of the customer/grower (e.g. arable
                farming, dairy, vineyard, orchard). See Agrovoc.
            member:
              $ref: '#/components/schemas/Member'
          required: [type, name]

    Member:
      type: object
      description: A member associated with a customer.
      properties:
        memberRole:
          type: string
          description: Based on the ADAPT Role data type.
        name:
          type: string
        street:
          type: string
        poBox:
          type: string
        postalCode:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          pattern: '^[A-Z]{2}$'

    Farm:
      description: >
        A grouping of fields that the farmer considers part of the same
        management group.
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              const: farm
              readOnly: true
              description: >
                Discriminator, set by agrirouter. Implied by the path on send.
            owner:
              $ref: '#/components/schemas/EntityReference'
              description: >
                The organization or customer the farm is assigned to. For a
                single-branch farm this is the organization; in a contractor
                scenario the farm equals the customer.
            name:
              type: string
            address:
              $ref: '#/components/schemas/Address'
            geoReference:
              $ref: '#/components/schemas/Geometry'
              description: A GeoJSON Point (longitude, latitude) locating the farm.
          required: [type, owner, name]

    SoilInfo:
      type: object
      description: Soil characteristics of a field.
      properties:
        type:
          type: string
          enum:
            - SAND
            - LOAMY_SAND
            - HEAVY_LOAMY_SAND
            - SANDY_TO_SILTY_LOAM
            - CLAYEY_LOAM
            - CLAY
        ratingPoints:
          type: number

    Field:
      description: >
        A named, customer-accepted physical space where production agriculture
        takes place, used to partition and identify data.
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              const: field
              readOnly: true
              description: >
                Discriminator, set by agrirouter. Implied by the path on send.
            name:
              type: string
            area:
              type: number
              description: Nominal area in square metres.
            customer:
              $ref: '#/components/schemas/EntityReference'
            farm:
              $ref: '#/components/schemas/EntityReference'
            soil:
              $ref: '#/components/schemas/SoilInfo'
            topography:
              type: number
              description: 'Slope / gradient, e.g. 7 (degrees).'
            fieldBoundaries:
              type: array
              description: References to the field's boundaries.
              items:
                $ref: '#/components/schemas/EntityReference'
            harvestPeriod:
              $ref: '#/components/schemas/HarvestPeriod'
            metadata:
              type: object
              description: >
                Additional key/value metadata. Participants MUST preserve and relay
                metadata they do not understand.
              additionalProperties: true
          required: [type, name]

    Obstacle:
      type: object
      description: >
        A GeoJSON Feature describing an in-field obstacle whose geometry is a
        Point, LineString, or Polygon.
      properties:
        type:
          const: Feature
        geometry:
          $ref: '#/components/schemas/Geometry'
        properties:
          type: object
          properties:
            kind:
              type: string
              description: 'Obstacle kind, e.g. "pole", "tree", "waterhole".'
          required: [kind]
      required: [type, geometry, properties]

    FieldBoundary:
      description: >
        A geometry identifying the geo-spatial coordinates of a field, including
        its outer boundary and any obstacles left out. A field may have several
        boundaries that differ in geometry by intended use.
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              const: fieldBoundary
              readOnly: true
              description: >
                Discriminator, set by agrirouter. Implied by the path on send.
            boundary:
              $ref: '#/components/schemas/Geometry'
              description: A GeoJSON Polygon or MultiPolygon.
            boundaryType:
              type: string
              description: The boundary classification.
              enum:
                - CONCEPTUAL
                - OPERATIONAL
                - ECONOMIC_DEFINED
                - ADMINISTRATIVE_RECEIVED
            creationMethod:
              type: string
              enum:
                - UNKNOWN
                - MANUAL
                - DRIVEN
                - SURVEYED
                - AUTO_OPERATION
                - AUTO_IMAGERY
                - ADMINISTRATIVE
            harvestPeriod:
              $ref: '#/components/schemas/HarvestPeriod'
            obstacles:
              type: array
              items:
                $ref: '#/components/schemas/Obstacle'
            regulatoryRequirements:
              type: string
              description: A regulatory constraint applying to the boundary.
              enum:
                - RED_ZONE_NITROGEN
                - WATER_PROTECTION_AREA
            metadata:
              type: object
              description: >
                Additional key/value metadata. Participants MUST preserve and relay
                metadata they do not understand.
              additionalProperties: true
          required: [type, boundary]

    OrganizationPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        nextPageToken:
          type: string
          description: Absent on the last page.
      required: [items]

    CustomerPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        nextPageToken:
          type: string
          description: Absent on the last page.
      required: [items]

    FarmPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Farm'
        nextPageToken:
          type: string
          description: Absent on the last page.
      required: [items]

    FieldPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Field'
        nextPageToken:
          type: string
          description: Absent on the last page.
      required: [items]

    FieldBoundaryPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FieldBoundary'
        nextPageToken:
          type: string
          description: Absent on the last page.
      required: [items]

    Entity:
      description: >
        Any master-data entity. Used only on the event stream, which carries every
        opted-in entity type over a single connection; the typed resources use the
        concrete schemas directly.
      oneOf:
        - $ref: '#/components/schemas/Organization'
        - $ref: '#/components/schemas/Customer'
        - $ref: '#/components/schemas/Farm'
        - $ref: '#/components/schemas/Field'
        - $ref: '#/components/schemas/FieldBoundary'
      discriminator:
        propertyName: type
        mapping:
          organization: '#/components/schemas/Organization'
          customer: '#/components/schemas/Customer'
          farm: '#/components/schemas/Farm'
          field: '#/components/schemas/Field'
          fieldBoundary: '#/components/schemas/FieldBoundary'

    Geometry:
      type: object
      description: >
        A GeoJSON geometry (RFC 7946). Positions are [longitude, latitude] and,
        optionally, altitude.
      properties:
        type:
          type: string
          enum: [Point, LineString, Polygon, MultiPolygon]
        coordinates:
          description: Nesting depth depends on `type`.
      required: [type, coordinates]

    EntityTypeToggle:
      type: object
      properties:
        entityType:
          type: string
          enum: [organizations, customers, farms, fields, fieldBoundaries]
        direction:
          type: string
          description: The permitted direction for this entity type.
          enum: [READ, WRITE, READ_WRITE]
      required: [entityType, direction]

    MasterdataConfig:
      type: object
      description: >
        Per-endpoint, per-entity opt-in for master-data exchange. Absence of a
        toggle for an entity type means the endpoint is not opted in for it.
      properties:
        endpointId:
          type: string
          readOnly: true
        toggles:
          type: array
          items:
            $ref: '#/components/schemas/EntityTypeToggle'
      required: [toggles]
