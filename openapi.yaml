      operationId: putField
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Field'
      responses:
        '200':
          description: Field accepted; the resulting canonical object is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Field'
        '201':
          description: A new canonical object was created.
          content:
