openapi: 3.1.0

info:
  title: Agriculture Masterdata Sync API
  version: 0.1.0-alpha1
  description: >
    HTTP surface for the Agriculture Masterdata Sync protocol (AgmaSync). It lets a
    connected participant send, deactivate, request, and read the master-data
    entities (organizations, persons, farms, fields, field boundaries) that
    agrirouter synchronizes across an n:m network of systems, and configure
    per-entity opt-in for an endpoint.

    Each entity type has its own set of paths and its own concrete schema; there
    is no generic entity resource. The union type `Entity` survives only where a
    single channel genuinely carries all types — the event stream.

    agrirouter holds the Single Source of Truth (SSOT): the canonical copy of
    every entity plus a mapping to each participant's own identifier.

    A write answers with the resulting canonical object, and that response is a
    delivery rather than an acknowledgement: it is the only place the writing
    endpoint sees the revision it just produced, since agrirouter does not echo a
    change back to its source. Clients MUST apply it as they apply an event from
    the stream, and MUST NOT apply any object whose `revision` is lower than the
    one they already hold. See "Applying what agrirouter returns" in
    specification.md.

    Attributes whose value set is expected to grow follow the Zalando RESTful
    API Guidelines convention for open-ended value lists
    (https://opensource.zalando.com/restful-api-guidelines/#112): instead of a
    closed `enum`, the currently known values are given as `examples` and the
    description carries the `[Extensible enum]` prefix. Values may be added to
    such an attribute without breaking deployed clients, so clients MUST accept
    unknown values, relay them unchanged, and fall back to their unknown-value
    handling. `enum` is reserved for sets this API fully controls and considers
    complete. See "Extensible enumerations" in specification.md.
  contact:
    name: DKE-Data Masterdata Sync Working Group

security:
  - bearerAuth: []

tags:
  - name: Organizations
    description: Sending, deactivating, requesting, and reading organizations.
  - name: Persons
    description: Sending, deactivating, requesting, and reading persons.
  - name: Farms
    description: Sending, deactivating, requesting, and reading farms.
  - name: Fields
    description: Sending, deactivating, requesting, and reading fields.
  - name: FieldBoundaries
    description: Sending, deactivating, requesting, and reading field boundaries.
  - name: Configuration
    description: Per-endpoint, per-entity opt-in for master-data exchange.
  - name: InitialLoad
    description: Per-endpoint initial-load state machine.
  - name: Events
    description: Receiving master-data changes as Server-Sent Events.

paths:
  # ------------------------------------------------------------- organizations

  /masterdata/organizations/{localId}:
    parameters:
      - $ref: '#/components/parameters/LocalId'
      - $ref: '#/components/parameters/AgrirouterEndpointId'
      - $ref: '#/components/parameters/BaseRevision'
    put:
      tags: [Organizations]
      summary: Send (create or update) an organization
      description: >
        Submits an organization from the calling endpoint. If the
        (application, localId) pair is already mapped to a canonical object, that
        object is updated; otherwise a new canonical object is created and an
        `agrirouterId` is assigned. The mapping is keyed by the application, not
        the endpoint: a `localId` names the same record whichever of the
        application's endpoints sends it. An update carries the revision it was
        edited from in `x-agrirouter-base-revision`; agrirouter merges a stale
        base where the changes do not overlap and rejects with `412` where they
        do, and rejects an update without a base with `428`. No-op updates (equal to the current canonical
        revision) do not create a new revision and are not forwarded.
      operationId: putOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'
      responses:
        '200':
          description: Organization accepted; the resulting canonical object is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '201':
          description: A new canonical object was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/MappingConflict'
        '412':
          $ref: '#/components/responses/RevisionConflict'
        '428':
          $ref: '#/components/responses/BaseRevisionRequired'

  /masterdata/organizations/{localId}/id-mapping/{agrirouterId}:
    parameters:
      - $ref: '#/components/parameters/LocalId'
      - $ref: '#/components/parameters/IdMappingAgrirouterId'
      - $ref: '#/components/parameters/AgrirouterEndpointId'
    put:
      tags: [Organizations]
      summary: Bind a local identifier to an existing organization
      description: >
        Declares that the canonical organization in the path is the one this endpoint
        knows as `localId` — used when the endpoint recognises a delivered object
        as one it already holds. Binding is not a data write: it creates no
        revision, does not change `sourceEndpointId`, and is delivered to nobody.
        Afterwards the ordinary PUT under that `localId` resolves to this object
        and updates it. An endpoint MUST bind before sending an object it
        received: an unbound send does not resolve and creates a duplicate.


        A local identifier denotes exactly one canonical object, so this is a
        singleton: binding a second one is the `409`. The request has no body,
        both ends of the mapping being in the path, and is idempotent.
      operationId: bindOrganizationMapping
      responses:
        '204':
          description: The mapping is recorded.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MappingConflict'
    delete:
      tags: [Organizations]
      summary: Declare that this endpoint no longer holds an organization
      description: >
        Declares that the endpoint no longer holds the canonical organization in the
        path under `localId` — deleted locally, or discarded while the endpoint
        was not a participant. It is the counterpart of the binding above and,
        like it, a declaration about the endpoint's own store, which agrirouter
        takes at face value and never infers. It is not the correction of a
        mistaken binding, and it is not a statement that the entity is inactive
        in the world — for the latter, use the deactivation operation, which is
        about the entity rather than about this endpoint's copy of it.


        Unbinding removes no canonical object, touches no other endpoint's
        mapping, creates no revision, and reaches nobody. The object stays one
        this endpoint is entitled to, so its next change is delivered again,
        carrying no `localId`, and the endpoint MUST then treat it as new:
        opt-in is the only filter on what an endpoint receives, and unbinding is
        not an instruction to stop sending. An endpoint that wants the object
        back at once requests it by `agrirouterId` rather than waiting for a
        change.
      operationId: unbindOrganizationMapping
      responses:
        '204':
          description: >
            The endpoint holds no mapping for this pair. Returned whether or not
            one existed, so a retry after a lost response is safe.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /masterdata/organizations/{localId}/deactivation:
    parameters:
      - $ref: '#/components/parameters/LocalId'
      - $ref: '#/components/parameters/AgrirouterEndpointId'
      - $ref: '#/components/parameters/BaseRevision'
    post:
      tags: [Organizations]
      summary: Deactivate an organization
      description: >
        Signals that the organization was deactivated in the source system (archival,
        deletion, or similar). The canonical object is set inactive but retained.
        The operation is idempotent: deactivating an already-inactive entity
        succeeds without creating a new revision or notification. The first
        deactivation is a write like any other and carries the revision it was
        made from in `x-agrirouter-base-revision`; a concurrent edit to the
        object is a conflict, and only one of the two succeeds. On an object
        that is already inactive the header is ignored.
      operationId: deactivateOrganization
      responses:
        '200':
          description: Organization is inactive (either newly deactivated or already inactive).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/RevisionConflict'
        '428':
          $ref: '#/components/responses/BaseRevisionRequired'

  /masterdata/organizations/requests:
    parameters:
      - $ref: '#/components/parameters/AgrirouterEndpointId'
    post:
      tags: [Organizations]
      summary: Request an organization (lazy loading)
      description: >
        Refetches an organization the caller is entitled to but does not currently hold —
        an object lost locally, or one referenced by an object that arrived
        before its own entity type's initial-load stream delivered it.
        Opt-in remains the only filter on delivery, so a request never returns
        anything the stream would not also deliver. The object arrives
        asynchronously as a master-data change event (see `/masterdata/events`).
        It is delivered even when the requesting application was the object's
        last writer: origin suppression does not apply to a requested object,
        since refetching something it wrote itself is exactly what an application
        that lost the object needs.
      operationId: requestOrganization
      requestBody:
        $ref: '#/components/requestBodies/EntityRequest'
      responses:
        '202':
          $ref: '#/components/responses/RequestAccepted'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

