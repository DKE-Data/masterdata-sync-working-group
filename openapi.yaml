openapi: 3.1.0

info:
  title: Agriculture Masterdata Sync API
  version: 0.1.0
  description: >
    HTTP surface for the Agriculture Masterdata Sync Protocol (AMSP). It lets a
    connected participant send, deactivate, request, and read the master-data
    entities (organizations, customers, farms, fields, field boundaries) that
    agrirouter synchronizes across an n:m network of systems, and configure
    per-entity opt-in for an endpoint.


    Each entity type has its own set of paths and its own concrete schema; there
    is no generic entity resource. The union type `Entity` survives only where a
    single channel genuinely carries all types — the event stream.


    agrirouter holds the Single Source of Truth (SSOT): the canonical copy of
    every entity plus a mapping to each participant's own identifier. This API is
    the concrete transport for the `masterdata:*` message types described in the
    companion specification (`specification.md`). It is a working draft and tracks
    the open issues noted there; schemas and paths are provisional pending the
    FarmSPT object-model alignment.
  contact:
    name: DKE-Data Masterdata Sync Working Group

servers:
  - url: https://api.qa.agrirouter.farm
    description: QA
  - url: https://api.prod.agrirouter.farm
    description: Production

security:
  - bearerAuth: []

tags:
  - name: Organizations
    description: Sending, deactivating, requesting, and reading organizations.
  - name: Customers
    description: Sending, deactivating, requesting, and reading customers.
  - name: Farms
    description: Sending, deactivating, requesting, and reading farms.
  - name: Fields
    description: Sending, deactivating, requesting, and reading fields.
  - name: FieldBoundaries
    description: Sending, deactivating, requesting, and reading field boundaries.
  - name: Configuration
    description: Per-endpoint, per-entity opt-in for master-data exchange.
  - name: Events
    description: Receiving master-data changes as Server-Sent Events.

paths:
  # ------------------------------------------------------------- organizations

  /masterdata/organizations/{localId}:
    parameters:
      - $ref: '#/components/parameters/LocalId'
    put:
      tags: [Organizations]
      summary: Send (create or update) an organization
      description: >
        Submits a `masterdata:organization` object from the calling endpoint. If the
        (endpoint, localId) pair is already mapped to a canonical object, that
        object is updated; otherwise a new canonical object is created and an
        `agrirouterId` is assigned. No-op updates (equal to the current canonical
        revision) do not create a new revision and are not forwarded.
      operationId: putOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'
      responses:
        '200':
          description: Organization accepted; the resulting canonical object is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '201':
          description: A new canonical object was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/MappingConflict'
    get:
      tags: [Organizations]
      summary: Read one canonical organization by local identifier
      operationId: getOrganizationByLocalId
      responses:
        '200':
          description: The canonical object mapped to this endpoint's local id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /masterdata/organizations/{localId}/deactivation:
    parameters:
      - $ref: '#/components/parameters/LocalId'
    post:
      tags: [Organizations]
      summary: Deactivate an organization
      description: >
        Signals that the organization was deactivated in the source system (archival,
        deletion, or similar). The canonical object is set inactive but retained.
        The operation is idempotent: deactivating an already-inactive entity
        succeeds without creating a new revision or notification.
      operationId: deactivateOrganization
      responses:
        '200':
          description: Organization is inactive (either newly deactivated or already inactive).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /masterdata/organizations:
    get:
      tags: [Organizations]
      summary: List canonical organizations the endpoint is entitled to
      description: >
        Returns the canonical organizations that the calling endpoint may receive under
        its opt-in configuration. Primarily used during the "seeding from
        agrirouter" phase of initial load.
      operationId: listOrganizations
      parameters:
        - $ref: '#/components/parameters/Active'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of canonical organizations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPage'
        '403':
          $ref: '#/components/responses/Forbidden'

  /masterdata/organizations/by-id/{agrirouterId}:
    parameters:
      - $ref: '#/components/parameters/AgrirouterId'
    get:
      tags: [Organizations]
      summary: Read one canonical organization by agrirouter identifier
      operationId: getOrganizationById
      responses:
        '200':
          description: The canonical object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /masterdata/organizations/requests:
    post:
      tags: [Organizations]
      summary: Request an organization (lazy loading)
      description: >
        Actively requests an organization the caller does not currently hold — for
        example a predecessor referenced through `previousVersions`, or a
        dependency not yet seeded. If the caller is entitled to the entity, it is
        delivered asynchronously as a master-data change event (see
        `/masterdata/events`).
      operationId: requestOrganization
      requestBody:
        $ref: '#/components/requestBodies/EntityRequest'
      responses:
        '202':
          $ref: '#/components/responses/RequestAccepted'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

