        succeeds without creating a new revision or notification.
      operationId: deactivateFarm
      responses:
        '200':
          description: Farm is inactive (either newly deactivated or already inactive).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Farm'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /masterdata/farms/requests:
    post:
      tags: [Farms]
      summary: Request a farm (lazy loading)
      description: >
        Actively requests a farm the caller does not currently hold — for
        example a predecessor referenced through `previousVersions`, or a
        dependency not yet loaded. If the caller is entitled to the entity, it is
