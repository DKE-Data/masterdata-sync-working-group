  # ------------------------------------------------------------------- events

  /masterdata/events:
    get:
      tags: [Events]
      summary: Receive master-data changes (Server-Sent Events)
      description: >
        A persistent SSE stream of master-data changes for the calling endpoint.
        agrirouter never echoes a change back to the endpoint it originated from.
        Because one stream carries every opted-in entity type, each event's `data`
        is an `Entity` — an `Organization`, `Person`, `Farm`, `Field`, or
        `FieldBoundary` discriminated by its `type` property. Delivered objects
        carry this endpoint's own `localId` in `idMappings` when known.
      operationId: streamMasterdataEvents
      responses:
        '200':
          description: An event stream.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/Entity'
                description: >
                  The `data:` payload of each SSE frame. Frames carry an `event:`
                  of either `MASTERDATA_CHANGED` or `MASTERDATA_DEACTIVATED`.

  # ------------------------------------------------------------ configuration

  /endpoints/{externalEndpointId}/masterdata-config:
    parameters:
      - $ref: '#/components/parameters/ExternalEndpointId'
    get:
      tags: [Configuration]
      summary: Get the endpoint's master-data opt-in configuration
      operationId: getMasterdataConfig
      responses:
        '200':
          description: The current configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterdataConfig'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Configuration]
      summary: Set the endpoint's master-data opt-in configuration
      description: >
        Configures per-entity opt-in. Master-data routes
        are created only through this explicit opt-in, never by default routing.
        Enabling reception of fields SHOULD also enable the organizations,
        persons, farms, and field boundaries those fields depend on.

        Opting an entity type in also starts its initial load: that entity
        type enters the `LOADING_FROM_AGRIROUTER` state (see the Initial Load
        resource).
      operationId: putMasterdataConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterdataConfig'
      responses:
        '200':
          description: Updated configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterdataConfig'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ----------------------------------------------------------------- initial load

  /endpoints/{externalEndpointId}/masterdata-initial-load:
    parameters:
      - $ref: '#/components/parameters/ExternalEndpointId'
    get:
      tags: [InitialLoad]
      summary: Get initial load status for all entity types
      description: >
        Returns the per-entity-type initial load state for the endpoint.
        The state machine per entity type is:
        `NOT_STARTED` → `LOADING_FROM_AGRIROUTER` → `LOADING_TO_AGRIROUTER` →
        `COMPLETED`. Opting an entity type in (via the master-data configuration)
        moves it to `LOADING_FROM_AGRIROUTER`; the endpoint then drives it forward
        by sending a PUT request to its per-entity-type `status` subresource.
      operationId: getInitialLoadStatus
      responses:
        '200':
          description: The endpoint's initial load status across all entity types.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitialLoadStatus'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /endpoints/{externalEndpointId}/masterdata-initial-load/{entityType}/status:
    parameters:
      - $ref: '#/components/parameters/ExternalEndpointId'
      - $ref: '#/components/parameters/InitialLoadEntityType'
    get:
      tags: [InitialLoad]
      summary: Get initial load status for one entity type
      operationId: getEntityInitialLoadStatus
      responses:
        '200':
          description: The initial load status for this entity type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityInitialLoadStatus'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [InitialLoad]
      summary: Set the initial load state for one entity type
      description: >
        Sets this entity type's initial-load `state`. Only forward transitions are
        valid; agrirouter rejects any other with `409`.


        Set `LOADING_TO_AGRIROUTER` to confirm the endpoint has received the full
        "loading from agrirouter" set (optionally carrying a `checkpoint` marking
        how far it consumed, for resume); from that point the endpoint sends the
        objects it knows about via the ordinary PUT operations. Set `COMPLETED`
        once the endpoint has sent everything, after which steady-state (day-2)
        synchronization applies. The initial
        `NOT_STARTED → LOADING_FROM_AGRIROUTER` transition is driven by opting the
        entity type in, not by this operation.


        Idempotent: setting the state the entity type is already in returns the
        current status unchanged.
      operationId: setEntityInitialLoadState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitialLoadStateUpdate'
      responses:
        '200':
          description: Updated initial load status for this entity type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityInitialLoadStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InitialLoadConflict'

components:
  securitySchemes:
    bearerAuth:
      type: oauth2
      description: OAuth 2.0 bearer tokens obtained via the Client Credentials flow.
      flows:
        clientCredentials:
          tokenUrl: https://api.prod.agrirouter.farm/oauth/token
          scopes:
            manage_endpoints: Configure endpoints and their master-data opt-in.
            masterdata: Send, request, and read synchronized master data.

  parameters:
    LocalId:
      name: localId
      in: path
      required: true
      description: >
        The sending participant's own identifier for the entity. Unique within
        the calling endpoint per entity type. A local identifier already mapped to
        a different canonical object is rejected (see the specification,
        "Identifier mapping").
      schema:
        type: string
    ExternalEndpointId:
      name: externalEndpointId
      in: path
      required: true
      description: The endpoint's external identifier.
      schema:
        type: string
    InitialLoadEntityType:
      name: entityType
      in: path
      required: true
      description: The master-data entity type.
      schema:
        type: string
        enum: [organizations, persons, farms, fields, fieldBoundaries]

  requestBodies:
    EntityRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EntityRequest'

  responses:
    RequestAccepted:
      description: >
        Request accepted; the entity will be delivered via the event stream if
        the caller is entitled to it.
    ValidationError:
      description: >
        The message failed hard validation against the master-data subset and was
        rejected without being applied or forwarded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: >
        The caller is not the owner of the endpoint, or is not opted in / not
        permitted to write the entity type.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such entity, or the caller is not entitled to it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MappingConflict:
      description: >
        The supplied local identifier is already mapped to a different canonical
        object (an asymmetric / n:1 mapping the caller must resolve).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InitialLoadConflict:
      description: >
        The requested transition is not valid from the entity type's current
        initial load state (e.g. confirming before opt-in, or completing before
        confirming).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
      required: [code, message]

    EntityRequest:
      type: object
      description: A lazy-loading request for a single canonical object.
      properties:
        agrirouterId:
          type: string
          format: uuid
          description: The canonical identifier of the wanted entity.
      required: [agrirouterId]

    EntityReference:
      type: object
      description: >
        A reference to another entity by canonical and/or local id. On send
        either identifier suffices: a localId is resolved against the sender's
        own mapping, and is rejected if the target has not been sent yet. On
        delivery agrirouter populates agrirouterId, since the sender's localId
        does not resolve in the receiver's namespace.
      properties:
        agrirouterId:
          type: string
          format: uuid
        localId:
          type: string
      anyOf:
        - required: [agrirouterId]
        - required: [localId]

    PartyReference:
      description: >
        A reference to a party. The slot admits both organizations and persons,
        so the entity type is required: a receiver that does not hold the target
        must lazy-load it, and the request endpoints are per entity type. Typed
        slots such as a field's farm need no discriminator.
      allOf:
        - $ref: '#/components/schemas/EntityReference'
        - type: object
          properties:
            type:
              enum: [organization, person]
          required: [type]

    IdMapping:
      type: object
      description: One participant's local identifier for a canonical object.
      properties:
        endpointId:
          type: string
        localId:
          type: string
      required: [endpointId, localId]

    Envelope:
      type: object
      description: >
        Fields common to every master-data entity. The concrete entity type is
        determined by the path; each entity schema pins the `type` discriminator
        so that objects remain self-describing on the event stream.
      properties:
        agrirouterId:
          type: string
          format: uuid
          readOnly: true
          description: Canonical identifier, assigned by agrirouter. Absent on first send.
        localId:
          type: string
          description: The sending participant's own identifier for the entity.
        idMappings:
          type: array
          readOnly: true
          description: Maintained by agrirouter; ignored on send.
          items:
            $ref: '#/components/schemas/IdMapping'
        active:
          type: boolean
          default: true
        revision:
          type: integer
          readOnly: true
          description: Monotonic per-object counter maintained by agrirouter.
        modifiedAt:
          type: string
          format: date-time
          readOnly: true
        sourceEndpointId:
          type: string
          readOnly: true
        previousVersions:
          type: array
          description: References to entities this one supersedes (split / merge lineage).
          items:
            $ref: '#/components/schemas/EntityReference'
      required: [localId]


    Address:
      type: object
      properties:
        street:
          type: string
        poBox:
          type: string
        postalCode:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          pattern: '^[A-Z]{2}$'

    Contact:
      type: object
      properties:
        phone:
          type: string
        mobile:
          type: string
        email:
          type: string
          format: email

    HarvestPeriod:
      type: object
      description: >
        Canonical harvest period as an interval. A discrete year is mapped to an
        interval on send; `label` may round-trip the native presentation.
      properties:
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
          description: Absent means open / current.
        label:
          type: string
          description: 'Human-facing designation, e.g. "2026" or "2025/2026".'
      required: [validFrom]

    Organization:
      description: >
        A legal entity that may hold land and to which persons may belong. It
        plays no fixed role: whether it acts as a contractor or as a client
        follows from the relations it stands in, not from an attribute.
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/Party'
        - type: object
          properties:
            type:
              const: organization
              readOnly: true
              description: >
                Discriminator, set by agrirouter. Implied by the path on send.
            name:
              type: string
            commercialRegistryNumber:
              type: string
              description: Identifier from the commercial register.
          required: [type, name]

    Party:
      type: object
      description: >
        Attributes common to every party, whether an organization or a natural
        person. A farmer carries the fiscal identifiers as much as a company
        does; only the commercial register entry is specific to organizations.
      properties:
        address:
          $ref: '#/components/schemas/Address'
        contact:
          $ref: '#/components/schemas/Contact'
        billingAddress:
          $ref: '#/components/schemas/Address'
        taxNumber:
          type: string
          description: Identifier assigned by tax authorities.
        taxId:
          type: string
          description: Numerical identifier assigned by tax authorities.
        tradeId:
          type: string
          description: Numerical identifier assigned by public authorities.

    Person:
      description: >
        A natural person. A person may hold land, and may belong to one or more
        organizations through `memberships`.
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/Party'
        - type: object
          properties:
            type:
              const: person
              readOnly: true
              description: >
                Discriminator, set by agrirouter. Implied by the path on send.
            title:
              type: string
            firstName:
              type: string
            lastName:
              type: string
            memberships:
              type: array
              description: >
                The organizations this person belongs to, each with the role
                held there. A person carrying at least one entry is a member.
              items:
                $ref: '#/components/schemas/Membership'
          required: [type, lastName]

    Membership:
      type: object
      description: A role held by a person in one organization.
      properties:
        organizationId:
          $ref: '#/components/schemas/EntityReference'
          description: The organization the person belongs to.
        memberRole:
          $ref: '#/components/schemas/Role'
      required: [organizationId, memberRole]

    Partner:
      type: object
      description: >
        A party holding a role on a farm — the contractor that works it, the
        advisor that reads it. Records a business relationship only. It does NOT
        grant visibility of the farm: what an endpoint receives is decided by
        opt-in and routing.
      properties:
        partnerId:
          $ref: '#/components/schemas/PartyReference'
          description: The organization or person acting as partner.
        partnerRole:
          $ref: '#/components/schemas/Role'
      required: [partnerId, partnerRole]

    Role:
      type: string
      description: A role drawn from the ADAPT Role data type.
      enum:
        - UNKNOWN
        - AUTHORIZER
        - CROP_ADVISOR
        - CUSTOMER
        - CUSTOM_SERVICE_PROVIDER
        - DATA_SERVICES_PROVIDER
        - END_USER
        - FARM_MANAGER
        - FINANCIER
        - STATIONARY_ASSET_SUPPLIER
        - GOVERNMENT_AGENCY
        - GROWER
        - INPUT_SUPPLIER
        - INSURANCE_AGENT
        - IRRIGATION_MANAGER
        - LABORER
        - MARKET_ADVISOR
        - MARKET_PROVIDER
        - MOBILE_ASSET_SUPPLIER
        - OPERATOR
        - OWNER
        - TRANSPORTER

    Farm:
      description: >
        A grouping of fields that the farmer considers part of the same
        management group.
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              const: farm
              readOnly: true
              description: >
                Discriminator, set by agrirouter. Implied by the path on send.
            owner:
              $ref: '#/components/schemas/PartyReference'
              description: The organization or person that holds the farm.
            name:
              type: string
            specialisedUsageType:
              type: string
              description: >
                Production orientation of the farm (e.g. arable farming, dairy,
                vineyard, orchard). Free-form, drawn from AGROVOC where a
                matching concept exists.
            partners:
              type: array
              description: >
                Parties holding a role on this farm, such as the contractor that
                works it or the advisor that reads it.
              items:
                $ref: '#/components/schemas/Partner'
            address:
              $ref: '#/components/schemas/Address'
            geoReference:
              $ref: '#/components/schemas/Geometry'
              description: A GeoJSON Point (longitude, latitude) locating the farm.
          required: [type, owner, name]

    SoilInfo:
      type: object
      description: Soil characteristics of a field.
      properties:
        type:
          type: string
          enum:
            - SAND
            - LOAMY_SAND
            - HEAVY_LOAMY_SAND
            - SANDY_TO_SILTY_LOAM
            - CLAYEY_LOAM
            - CLAY
        ratingPoints:
          type: number

    Field:
      description: >
        A named physical space where production agriculture takes place, used
        to partition and identify data.
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              const: field
              readOnly: true
              description: >
                Discriminator, set by agrirouter. Implied by the path on send.
            name:
              type: string
            area:
              type: number
              description: Nominal area in square metres.
            farm:
              $ref: '#/components/schemas/EntityReference'
              description: The farm this field belongs to.
            owner:
              $ref: '#/components/schemas/PartyReference'
              description: >
                The organization or person holding this field, for systems that
                attribute fields to a party directly. When absent, the field is
                held by its farm's owner. When present, it takes precedence for
                this field, which is how a field held by one party but managed
                under another's farm is expressed.
            soil:
              $ref: '#/components/schemas/SoilInfo'
            topography:
              type: number
              description: 'Slope / gradient, e.g. 7 (degrees).'
            fieldBoundaries:
              type: array
              description: References to the field's boundaries.
              items:
                $ref: '#/components/schemas/EntityReference'
            harvestPeriod:
              $ref: '#/components/schemas/HarvestPeriod'
            metadata:
              type: object
              description: >
                Additional key/value metadata. Participants MUST preserve and relay
                metadata they do not understand.
              additionalProperties: true
          required: [type, name]

    Obstacle:
      type: object
      description: >
        A GeoJSON Feature describing an in-field obstacle whose geometry is a
        Point, LineString, or Polygon.
      properties:
        type:
          const: Feature
        geometry:
          $ref: '#/components/schemas/Geometry'
        properties:
          type: object
          properties:
            kind:
              type: string
              description: 'Obstacle kind, e.g. "pole", "tree", "waterhole".'
          required: [kind]
      required: [type, geometry, properties]

    FieldBoundary:
      description: >
        A geometry identifying the geo-spatial coordinates of a field, including
        its outer boundary and any obstacles left out. A field may have several
        boundaries that differ in geometry by intended use.
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              const: fieldBoundary
              readOnly: true
              description: >
                Discriminator, set by agrirouter. Implied by the path on send.
            boundary:
              $ref: '#/components/schemas/Geometry'
              description: A GeoJSON Polygon or MultiPolygon.
            boundaryType:
              type: string
              description: The boundary classification.
              enum:
                - CONCEPTUAL
                - OPERATIONAL
                - ECONOMIC_DEFINED
                - ADMINISTRATIVE_RECEIVED
            creationMethod:
              type: string
              enum:
                - UNKNOWN
                - MANUAL
                - DRIVEN
                - SURVEYED
                - AUTO_OPERATION
                - AUTO_IMAGERY
                - ADMINISTRATIVE
            harvestPeriod:
              $ref: '#/components/schemas/HarvestPeriod'
            obstacles:
              type: array
              items:
                $ref: '#/components/schemas/Obstacle'
            regulatoryRequirements:
              type: string
              description: A regulatory constraint applying to the boundary.
              enum:
                - RED_ZONE_NITROGEN
                - WATER_PROTECTION_AREA
            metadata:
              type: object
              description: >
                Additional key/value metadata. Participants MUST preserve and relay
                metadata they do not understand.
              additionalProperties: true
          required: [type, boundary]

    Entity:
      description: >
        Any master-data entity. Used only on the event stream, which carries every
        opted-in entity type over a single connection; the typed resources use the
        concrete schemas directly.
      oneOf:
        - $ref: '#/components/schemas/Organization'
        - $ref: '#/components/schemas/Person'
        - $ref: '#/components/schemas/Farm'
        - $ref: '#/components/schemas/Field'
        - $ref: '#/components/schemas/FieldBoundary'
      discriminator:
        propertyName: type
        mapping:
          organization: '#/components/schemas/Organization'
          person: '#/components/schemas/Person'
          farm: '#/components/schemas/Farm'
          field: '#/components/schemas/Field'
          fieldBoundary: '#/components/schemas/FieldBoundary'

    Geometry:
      type: object
      description: >
        A GeoJSON geometry (RFC 7946). Positions are [longitude, latitude] and,
        optionally, altitude.
      properties:
        type:
          type: string
          enum: [Point, LineString, Polygon, MultiPolygon]
        coordinates:
          description: Nesting depth depends on `type`.
      required: [type, coordinates]

    EntityTypeToggle:
      type: object
      properties:
        entityType:
          type: string
          enum: [organizations, persons, farms, fields, fieldBoundaries]
      required: [entityType]

    MasterdataConfig:
      type: object
      description: >
        Per-endpoint, per-entity opt-in for master-data exchange. Absence of a
        toggle for an entity type means the endpoint is not opted in for it.
      properties:
        endpointId:
          type: string
          readOnly: true
        toggles:
          type: array
          items:
            $ref: '#/components/schemas/EntityTypeToggle'
      required: [toggles]

    InitialLoadState:
      type: string
      description: >
        Per-endpoint, per-entity-type initial-load state. Opting an entity type
        in (via the master-data configuration) starts it at
        `LOADING_FROM_AGRIROUTER`; the endpoint then drives it forward by sending a
        PUT request to the entity type's `status` subresource.
      enum:
        - NOT_STARTED
        - LOADING_FROM_AGRIROUTER
        - LOADING_TO_AGRIROUTER
        - COMPLETED

    EntityInitialLoadStatus:
      type: object
      properties:
        entityType:
          type: string
          enum: [organizations, persons, farms, fields, fieldBoundaries]
        state:
          $ref: '#/components/schemas/InitialLoadState'
        checkpoint:
          type: string
          readOnly: true
          description: >
            Opaque marker of how far the from-agrirouter set has been confirmed.
            Echoed from the endpoint's confirmation; may be replayed to resume an
            interrupted initial load or a post-downtime catch-up.
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required: [entityType, state]

    InitialLoadStatus:
      type: object
      description: Initial-load state for every entity type of an endpoint.
      properties:
        endpointId:
          type: string
          readOnly: true
        entities:
          type: array
          items:
            $ref: '#/components/schemas/EntityInitialLoadStatus'
      required: [entities]

    InitialLoadStateUpdate:
      type: object
      description: >
        The target initial-load `state` for an entity type. Only forward
        transitions are accepted.
      properties:
        state:
          $ref: '#/components/schemas/InitialLoadState'
        checkpoint:
          type: string
          description: >
            When setting `LOADING_TO_AGRIROUTER` (confirming receipt of the
            from-agrirouter set), an opaque marker — e.g. the last cursor or
            revision watermark the endpoint received — identifying how much of the
            set was consumed. Used to resume an interrupted initial load.
      required: [state]
