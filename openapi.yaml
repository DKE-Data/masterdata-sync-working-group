        '404':
          $ref: '#/components/responses/NotFound'

  # ------------------------------------------------------------------- events

  /masterdata/events:
    get:
      tags: [Events]
      summary: Receive master-data changes (Server-Sent Events)
      description: >
        A persistent SSE stream of master-data changes for the calling
        application, carrying every tenant it is routed to and every entity type
        it is opted into. agrirouter never echoes a change back to the endpoint
        it originated from; a change made by one endpoint is still delivered to
        the application's other endpoints. Each event's
        `data` is an `Entity` — an `Organization`, `Person`, `Farm`, `Field`, or
        `FieldBoundary` discriminated by its `type` property. A delivered object
        carries the receiving application's own identifier in `localId` when
        agrirouter holds one, and no `localId` at all when it does not.

        This stream carries steady-state synchronization only. Initial load is
        delivered separately, per endpoint, by
        `/endpoints/{externalEndpointId}/masterdata-initial-load/events`;
        the two are independent and are not deduplicated against each other, so an
        object may arrive on both while an endpoint is loading.

        An application reconnecting after an absence is served catch-up before
        live changes: everything it is entitled to that changed since its
        position, ordered so that a referenced object precedes the objects that
        reference it, ending with a `CAUGHT_UP` event. That is the only property
        of the order an application may rely on. The order itself is
        agrirouter's and may change in a later version of this API, so an
        application MUST NOT depend on the position of one entity type relative
        to another, or read the completeness of an entity type out of it.
        `Last-Event-ID` is the only position the application keeps, and
        positions do not expire.

        The stream also carries `ENDPOINT_SELECTION_CHANGED`, which states which
        entity types the user has selected for one of the application's
        endpoints. It is issued every time that selection moves — the endpoint
        routed to master-data, a type selected, a type deselected, the last one
        deselected — and the selection is recorded by agrirouter and is not a
        resource of this API, so this frame is the only place an application is
        told it. On catch-up agrirouter restates it for every endpoint that has
        a selection and for every endpoint whose selection was emptied, so that a
        withdrawal reaches an application that was offline when it happened. The
        frame therefore arrives more than once for one selection and MUST be
        handled idempotently.
      operationId: streamMasterdataEvents
      parameters:
        - $ref: '#/components/parameters/LastEventId'
      responses:
        '200':
          description: An event stream.
          content:
            text/event-stream:
              schema:
                description: >
                  SSE stream as defined in https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events

                  SSE event would carry three parts: "id:", "event:" and "data:".

                  The `data:` is a payload of each SSE frame. Frames carry an `event:`
                  of `MASTERDATA_CHANGED`, `MASTERDATA_DEACTIVATED`,
                  `CAUGHT_UP` or `ENDPOINT_SELECTION_CHANGED`; the first two carry an `Entity`,
                  `CAUGHT_UP` has no data and `ENDPOINT_SELECTION_CHANGED` carries an event payload. 
                  Every frame also carries an `id:`, which is the
                  delivery position as of that frame — what the application
                  persists once it has durably applied the frame, and returns as
                  `Last-Event-ID` on reconnect. `id` may repeat across some events
                  and application should not expect it would always advance or
                  attempt to parse, compare, or construct it in any way: `id` must
                  be treated as an opaque string whose structure may change.
                  Whatever `id` a frame carries is safe to resume from once that
                  frame and every frame before it have been applied.
                oneOf:
                  - $ref: '#/components/schemas/Entity'
                  - $ref: '#/components/schemas/EndpointSelectionChangedEventData'

  # ------------------------------------------------------------ configuration

  /endpoints/{externalEndpointId}/masterdata-config:
    parameters:
      - $ref: '#/components/parameters/ExternalEndpointId'
    get:
      tags: [Configuration]
      summary: Get what the endpoint has declared it can exchange
      operationId: getMasterdataConfig
      responses:
        '200':
          description: The current configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterdataConfig'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Configuration]
      summary: Set the endpoint's master-data opt-in configuration
      description: >
        Configures per-entity opt-in. Master-data routes
        are created only through this explicit opt-in, never by default routing.

        The configuration MUST be dependency-closed: enabling fields requires
        the farms and field boundaries those fields reference, and the
        organizations and persons those farms reference, to be enabled as well. A configuration that is
        not dependency-closed is rejected with `400`.

        Opting the endpoint into its first entity type starts its initial load:
        the endpoint enters the `LOADING_FROM_AGRIROUTER` state (see the Initial
        Load resource), and its canonical set — every object of every opted-in
        entity type — is collected by the endpoint from
        `/endpoints/{externalEndpointId}/masterdata-initial-load/events`. The set
        waits there until the endpoint connects and is not lost if it is
        disconnected at the time.

        Initial load is one state and one stream per endpoint, not per entity
        type. Adding an entity type to an endpoint that already has initial-load
        state therefore restarts the load, from whatever state the endpoint is
        in: it re-enters `LOADING_FROM_AGRIROUTER` and the set is sent again,
        covering every opted-in type, since agrirouter cannot enumerate what the
        endpoint missed while the type was not opted in. Removing a toggle stops
        delivery of that entity type and leaves the initial-load state as it
        is; removing the last toggle discards it. Opting out discards neither
        the canonical objects nor the application's identifier mapping, so a
        repeat load arrives matched, and `previousLoadCompletedAt` on the
        Initial Load resource marks it as a repeat. An endpoint that needs the
        set again SHOULD set `LOADING_FROM_AGRIROUTER` on the Initial Load
        status resource rather than opting an entity type out and back in.
      operationId: putMasterdataConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterdataConfig'
      responses:
        '200':
          description: Updated configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterdataConfig'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ----------------------------------------------------------------- initial load

  /endpoints/{externalEndpointId}/masterdata-initial-load/events:
    parameters:
      - $ref: '#/components/parameters/ExternalEndpointId'
    get:
      tags: [InitialLoad]
      summary: Receive the endpoint's canonical set (Server-Sent Events)
      description: >
        Delivers the canonical set this endpoint is owed: every object of every
        entity type it is opted into that it is entitled to, while the endpoint
        is in `LOADING_FROM_AGRIROUTER`. One stream per endpoint, matching the
        granularity of the initial-load state and the shape of its status
        resource. The set is complete: objects that are deactivated are part of
        it and arrive with `active: false`, and so are objects whose current
        revision the requesting application itself last wrote — origin
        suppression does not apply here, since withholding them would have a
        returning endpoint push them back as new and duplicate them. A delivered
        object carries the application's own identifier in `localId` where
        agrirouter holds one.

        agrirouter closes the HTTP response once it has sent the whole set and
        then moves the endpoint to `RECONCILING`. The set is fixed when the load
        starts: an entity type opted in while the set is streaming restarts the
        load, so the endpoint re-enters `LOADING_FROM_AGRIROUTER` and the set is
        sent again including the new type.

        Order is agrirouter's, not the endpoint's. The set is delivered so that a
        referenced object precedes the objects that reference it, as catch-up on
        `/masterdata/events` is, and opt-in is dependency-closed, so the target
        of every reference is in the set and an endpoint can apply each object
        as it arrives. That is the only property of the order an endpoint may
        rely on: the order itself may change in a later version of this API, so
        an endpoint MUST NOT depend on the position of one entity type relative
        to another, or read the completeness of an entity type out of it. An
        object referenced from the live stream that this stream has not
        delivered yet is requested (`POST /masterdata/<types>/requests`).

        The stream carries **no delivery position**: it delivers a set rather than
        a sequence of changes, so it takes no `Last-Event-ID`, its frames carry no
        `id:`, and a connection that drops before the set is complete is recovered
        by requesting it again from the beginning.

        An endpoint MUST NOT treat the response ending as proof that the set
        arrived — a dropped connection ends it the same way. Whether the set was
        sent is recorded in the endpoint's state on the Initial Load resource,
        which agrirouter advances only after sending everything.

        This stream is independent of the application's steady-state stream
        `/masterdata/events`, which keeps running throughout and is not
        deduplicated against this one.
      operationId: streamInitialLoadEvents
      responses:
        '200':
          description: >
            The canonical set, as an event stream. The response closing is what
            marks the set complete.
          content:
            text/event-stream:
              schema:
                description: >
                  SSE stream as defined in https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events

                  SSE event would carry three parts: "id:", "event:" and "data:".

                  Every frame carries an `event:` of `MASTERDATA_CHANGED`
                  and an `Entity` type in the `data:` payload.
                $ref: '#/components/schemas/Entity'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /endpoints/{externalEndpointId}/masterdata-initial-load/status:
    parameters:
      - $ref: '#/components/parameters/ExternalEndpointId'
    get:
      tags: [InitialLoad]
      summary: Get the endpoint's initial load status
      description: >
        Returns the endpoint's initial load state. There is one state per
        endpoint, covering every entity type it is opted into; an endpoint
        opted into no entity type has no initial-load state and is `404`. The
        state machine is:
        `LOADING_FROM_AGRIROUTER` → `RECONCILING` → `LOADING_TO_AGRIROUTER` →
        `COMPLETED`. Entering `LOADING_FROM_AGRIROUTER` is agrirouter's alone and
        follows from the user's opt-in and from nothing else: the user selecting
        the endpoint's first entity type, when routing it to the master-data hub,
        starts it there, and selecting a further entity type returns it there. An
        application cannot enter it, from any state including from itself, and
        there is no operation for asking that the set be sent again. agrirouter
        itself advances it to `RECONCILING` once the whole canonical set has been
        sent; the endpoint drives the remaining two transitions by sending a PUT
        request to this resource.

        Initial load is one state and one stream per endpoint, not per entity
        type, which is why selecting a further type restarts it from whatever
        state the endpoint is in: the set is fixed when a load starts, and
        agrirouter cannot enumerate what the endpoint missed while the type was
        not selected, so the whole set — every selected type — is sent again.
        Deselecting a type stops its delivery and leaves this state as it is;
        deselecting the last one discards it, and the endpoint is then `404`.
        Neither the canonical objects nor the application's identifier mapping
        are discarded by a deselection, so a repeat load arrives matched, and
        `previousLoadCompletedAt` below marks it as a repeat.
      operationId: getInitialLoadStatus
      responses:
        '200':
          description: The endpoint's initial load status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitialLoadStatus'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [InitialLoad]
      summary: Set the endpoint's initial load state
      description: >
        Sets the endpoint's initial-load `state`. The states advance in order
        and agrirouter rejects any other transition with `409`. The two
        transitions available here are the endpoint's own: the confirmation and
        the completion.


        Set `LOADING_TO_AGRIROUTER` to confirm the endpoint has *reconciled* the
        canonical set, not merely received it. Receipt is already recorded:
        agrirouter moved the endpoint to `RECONCILING` when it finished sending,
        so this operation asserts only that the conflicts reconciling surfaced have
        been resolved in the endpoint's own software. That is human-paced and
        unbounded, so an endpoint may sit in `RECONCILING` for a long time
        without anything being wrong. Carry the bindings reconciliation produced
        in `idMappings`, so the objects the endpoint matched resolve to the
        canonical objects they were matched to. From that point the endpoint sends
        the objects it knows about via the ordinary PUT operations. Set
        `COMPLETED` once the endpoint has sent everything, after which
        steady-state (day-2) synchronization applies.


        Setting `LOADING_TO_AGRIROUTER` while the endpoint is still
        `LOADING_FROM_AGRIROUTER` is rejected with `409`: the endpoint cannot have
        reconciled a set it has not finished receiving. An endpoint enters
        `LOADING_FROM_AGRIROUTER` when it is opted in, when an entity type is
        added, or when a user asks agrirouter to load it again, and leaves it
        when agrirouter has sent the set — none of which happens through this
        operation.


        Setting `LOADING_FROM_AGRIROUTER` is a `409` from every state, including
        from itself.


        Repeating an endpoint-driven transition is not a conflict. Setting the
        state the endpoint is already in returns `200` with the current
        status; if the request carries `idMappings`, each pair is applied again
        — binding is idempotent per pair — and `rejectedIdMappings` is
        recomputed against the mapping as it now stands. That is how an endpoint
        recovers from a lost response: it cannot read its mapping back, so
        repeating the confirmation is its only way to learn which bindings were
        recorded. Only out-of-order transitions are `409`.
      operationId: setInitialLoadState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitialLoadStateUpdate'
      responses:
        '200':
          description: Updated initial load status for this endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitialLoadStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InitialLoadConflict'

  /endpoints/{externalEndpointId}/masterdata-initial-load/user-attention:
    parameters:
      - $ref: '#/components/parameters/ExternalEndpointId'
    put:
      tags: [InitialLoad]
      summary: Report that the endpoint's initial load is waiting on a user
      description: >
        Raises `awaitingUser` on the endpoint's initial-load status, so that
        agrirouter shows "waiting for you in <app>" — linking to the master-data
        resolution URI supplied for this endpoint — in place of its own "this
        application is working through your data".


        It is a resource of its own because reporting a user is not a
        transition. Conflicts surface object by object, so an endpoint has to be
        able to say this from any state before `COMPLETED`, including while the
        canonical set is still arriving; naming a state in order to say it would
        mean naming one the endpoint does not own and cannot set. This names
        none, so it never races the transitions agrirouter drives and is never
        out of order.


        It carries no body and raises the flag; there is nothing to lower it
        with, because lowering it is not the endpoint's to do. agrirouter clears
        it on the two endpoint-driven transitions — advancing to
        `LOADING_TO_AGRIROUTER` or to `COMPLETED` — and the step to
        `RECONCILING` does not, that being agrirouter reporting it has finished
        sending rather than the user having finished deciding. Repeating it
        while it is already raised is a `200`.


        agrirouter learns *that* a person is needed and never what for: it is one
        bit per endpoint, not a conflict list. Nothing in the protocol branches
        on it, so an endpoint that never calls this costs precision rather than
        correctness.
      operationId: reportUserAttention
      responses:
        '200':
          description: The endpoint's initial load status, with the flag raised.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitialLoadStatus'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >
            The endpoint's initial load is `COMPLETED`, and a completed load is
            waiting on nobody. An endpoint opted into no entity type has no
            initial-load state at all and is `404`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: oauth2
      description: OAuth 2.0 bearer tokens obtained via the Client Credentials flow.
      flows:
        clientCredentials:
          tokenUrl: https://api.prod.agrirouter.farm/oauth/token
          scopes:
            manage_endpoints: Configure endpoints and their master-data opt-in.
            masterdata: Send, request, and read synchronized master data.

  parameters:
    LocalId:
      name: localId
      in: path
      required: true
      description: >
        The sending application's own identifier for the entity. Unique across
        the whole application per entity type, whichever of its endpoints sends
        it: the mapping is keyed `(application, localId)`. A local identifier
        already mapped to a different canonical object is rejected (see the
        specification, "Identifier mapping").
      schema:
        type: string
    AgrirouterEndpointId:
      name: x-agrirouter-endpoint-id
      in: header
      required: true
      description: >
        The endpoint acting — the sender of an entity, the caller of a request,
        the holder of a binding. The token authorizes an *application*, which
        holds many endpoints across many tenants, so the acting one is named per
        request rather than derived. It decides entitlement and the tenant, and it
        becomes the `sourceEndpointId` of any revision produced. It does not
        scope `localId`, which resolves in the application's namespace.


        This is the agrirouter endpoint ID — the `id` of the endpoint, not the
        `external_id` the application chose for it. An application already holds
        it: it is returned when the endpoint is created or updated, listed with
        the tenant's endpoints, and carried on the endpoint events. The same
        header identifies the sending endpoint on every master-data write.
      schema:
        type: string
        format: uuid
    BaseRevision:
      name: x-agrirouter-base-revision
      in: header
      required: false
      description: >
        The `revision` the client edited from — the base of this write. It is
        a precondition on the request, not part of the entity, which is why it
        travels as a header: `revision` in the body stays `readOnly` and
        server-assigned, and a client-supplied revision is compared, never
        assigned.


        Required on a write to an object that already exists; absent there is
        `428`, since omitting it would opt the client out of concurrency
        control. Absent on a create is normal, there being no base. Present on
        a request that does not resolve to an existing object it is `412`: the
        client believes it is updating something agrirouter does not know under
        that `localId`.


        A base behind the current revision is not necessarily a failure.
        agrirouter three-way merges where the client's change and the
        intervening ones do not overlap and answers `200` with the merged
        object, whose `revision` is then not base + 1; where they overlap it
        answers `412` with the current revision. A write whose payload equals
        the current canonical value succeeds as a no-op whatever the base. See
        "Concurrency control" in specification.md.
      schema:
        type: integer
        minimum: 1
    IdMappingAgrirouterId:
      name: agrirouterId
      in: path
      required: true
      description: >
        The canonical object the local identifier in the path denotes. The
        endpoint at the other end of the mapping is scoped exactly as the entity
        path it hangs off, so it is not a segment here.
      schema:
        type: string
        format: uuid
    ExternalEndpointId:
      name: externalEndpointId
      in: path
      required: true
      description: >
        The application's own identifier for the endpoint — the `external_id` it
        supplied when creating it, and the same key the endpoint resource itself
        is addressed by. Configuration and initial-load state are addressed this
        way, as endpoint management is; the entity operations name the acting
        endpoint by its agrirouter ID in a header instead, as sending does.
      schema:
        type: string
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: >
        The event id the application saved last from `/masterdata/events`
        stream, as agrirouter issued it in the `id:` field of an SSE
        frame.
        The application MUST send it back exactly as issued, treat it as an opaque string
        and MUST NOT interpret, compare, construct, or modify it in any way. Its
        structure is not defined by this API and may change; the example below
        illustrates its size and shape only.

        It does not always advance on every frame: the same value may repeat
        on some frames, and an application MUST NOT read anything into that
        beyond its own position for `Last-Event-ID` being unchanged.


        The application MUST save it from what it has **durably applied**
        rather than from whatever its stream client last read; delivery is
        at-least-once, so everything after it is sent again on reconnect. Where
        applies complete out of order, store the id of the earliest frame, in
        the order the stream delivered them, that is not yet applied: ids are
        not comparable by the application, so this is a matter of remembering
        delivery order. It does not expire, and agrirouter stores no copy of it.


        Omitted, or present and one agrirouter cannot validate, is served as a
        first connection on this stream: everything the application is entitled
        to, ending with a `CAUGHT_UP` frame. That costs the application its place
        in the stream and not its entitlement, and is how it asks for every
        entity to be delivered again.


        This parameter applies to `/masterdata/events` only. The initial-load
        stream carries no position and does not accept it.
      schema:
        type: string
      example: 'v1.f8yQ_KL5hHBS.TBQjL_8GeXSs6TIxFzsdQQ'

  requestBodies:
    EntityRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EntityRequest'

  responses:
    RequestAccepted:
      description: >
        Request accepted; the entity will be delivered via the event stream if
        the caller is entitled to it.
    ValidationError:
      description: >
        The payload failed hard validation against the master-data subset and was
        rejected without being applied or forwarded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: >
        The caller is not the owner of the endpoint, or is not opted in / not
        permitted to write the entity type.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No such entity, or the caller is not entitled to it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RevisionConflict:
      description: >
        The write could not be applied against its `x-agrirouter-base-revision`:
        the base is behind the current revision and the changes since overlap
        with the client's, so no merge is possible; or the base is one
        agrirouter never issued for this object; or a base was given for a
        `localId` that does not resolve to an existing object. The body carries
        the current revision. The client refetches the object — through the
        stream or `POST /masterdata/<types>/requests` — rebases its change, and
        writes again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RevisionConflictError'
    BaseRevisionRequired:
      description: >
        The object exists and the request carried no
        `x-agrirouter-base-revision`. Concurrency control is not optional on an
        update. The body carries the current revision so the client can obtain
        the object and write again with a base.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RevisionConflictError'
    MappingConflict:
      description: >
        The supplied local identifier is already mapped to a different canonical
        object, or — when binding — the canonical object is already bound to a
        different local identifier of this application. Both are checked across
        the whole application, not just the calling endpoint. Either way an asymmetric /
        n:1 mapping the caller must resolve. The body names which of the two
        identifiers is taken, and the mapping that holds it, since that is what
        the resolving side has to show its user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MappingConflictError'
    InitialLoadConflict:
      description: >
        The requested transition is not valid from the endpoint's current
        initial load state (e.g. confirming before the set has been sent, or
        completing before confirming).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
      required: [message]

    RevisionConflictError:
      description: >
        The `412` or `428` of a write: an `Error` carrying the revision the
        object is currently at, so that the client has the answer a rejected
        write would otherwise have to fetch separately.
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            currentRevision:
              type: integer
              description: The canonical object's current `revision`.
          required: [currentRevision]

    MappingConflictError:
      description: >
        The `409` of a binding: an `Error` carrying the rejection that caused it.
        The same shape the bulk path returns per pair, so an endpoint resolves a
        conflict identically whichever path raised it. As there, the outcome is
        carried by `rejection.reason`; the `message` of the `Error` is diagnostic
        and MUST NOT be branched on.
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            rejection:
              $ref: '#/components/schemas/IdMappingRejection'
          required: [rejection]

    IdMappingRejectionReason:
      type: string
      description: >
        [Extensible enum](https://github.com/DKE-Data/masterdata-sync-working-group/blob/main/specification.md#extensible-enumerations).
        Why a binding could not be recorded.


        `LOCAL_ID_ALREADY_BOUND` — this endpoint already knows a different
        canonical object by that `localId`. `existingMapping` names it.


        `AGRIROUTER_ID_ALREADY_BOUND` — this endpoint already knows that
        canonical object by a different `localId`. `existingMapping` names it.


        `UNKNOWN_OBJECT` — no such canonical object, or the endpoint is not
        entitled to it. On the per-entity operation this is the `404` instead.


        `DUPLICATE_IN_REQUEST` — the same `localId` or the same `agrirouterId`
        appears in more than one pair of this request, which would make the
        outcome depend on the order pairs were applied in. Every pair involved is
        rejected and none is applied. Bulk path only.
      examples:
        - LOCAL_ID_ALREADY_BOUND
        - AGRIROUTER_ID_ALREADY_BOUND
        - UNKNOWN_OBJECT
        - DUPLICATE_IN_REQUEST

    IdMappingRejection:
      description: >
        A binding that could not be recorded: the pair as submitted, why, and
        the mapping standing in its way.
      allOf:
        - $ref: '#/components/schemas/IdMappingBinding'
        - type: object
          properties:
            reason:
              $ref: '#/components/schemas/IdMappingRejectionReason'
            existingMapping:
              $ref: '#/components/schemas/IdMappingBinding'
              description: >
                The mapping that already holds the taken identifier. Both of its
                ends belong to the rejected endpoint itself, so naming it
                discloses nothing the endpoint does not already hold, and it is
                what the endpoint shows the user resolving the conflict. Present
                for `LOCAL_ID_ALREADY_BOUND` and `AGRIROUTER_ID_ALREADY_BOUND`,
                absent for the other reasons, where no mapping is in the way.
          required: [reason]

    EntityRequest:
      type: object
      description: A lazy-loading request for a single canonical object.
      properties:
        agrirouterId:
          type: string
          format: uuid
          description: The canonical identifier of the wanted entity.
      required: [agrirouterId]

    EntityReference:
      type: object
      description: >
        A reference to another entity by canonical and/or local id. On send
        either identifier suffices: a localId is resolved against the sender's
        own mapping, and is rejected if the target has not been sent yet. On
        delivery agrirouter populates agrirouterId, since the sender's localId
        does not resolve in the receiver's namespace.
      properties:
        agrirouterId:
          type: string
          format: uuid
        localId:
          type: string
      anyOf:
        - required: [agrirouterId]
        - required: [localId]

    PartyReference:
      description: >
        A reference to a party. The slot admits both organizations and persons,
        so the entity type is required: a receiver that does not hold the target
        must lazy-load it, and the request endpoints are per entity type. Typed
        slots such as a field's farm need no discriminator.
      allOf:
        - $ref: '#/components/schemas/EntityReference'
        - type: object
          properties:
            type:
              type: string
              enum: [organization, person]
          required: [type]

    IdMappingBinding:
      type: object
      description: >
        One binding of a local identifier to a canonical object, as carried in
        bulk on the initial-load confirmation.


        Both ends belong to the calling application's own store: the object it
        matched, and what it calls that object. A mapping only ever travels from
        an application to agrirouter.
      properties:
        agrirouterId:
          type: string
          format: uuid
        localId:
          type: string
      required: [agrirouterId, localId]

    Envelope:
      type: object
      description: >
        Fields common to every master-data entity. The concrete entity type is
        determined by the path; each entity schema pins the `type` discriminator
        so that objects remain self-describing on the event stream.
      properties:
        agrirouterId:
          type: string
          format: uuid
          readOnly: true
          description: Canonical identifier, assigned by agrirouter. Absent on first send.
        localId:
          type: string
          description: >
            Always the *calling* application's own identifier for the entity, in
            both directions: on send the sender's, on delivery the receiving
            application's. It never carries another application's identifier.
            One store per application, so the identifier is the same whichever
            of the application's endpoints sends or receives it.


            Required on send. On delivery it is present when agrirouter holds a
            mapping for the receiving application, and absent when it does not —
            an object the application has not bound, or has unbound. An absent
            `localId` means "you do not hold this object": create it locally and
            bind the identifier you issue.
        active:
          type: boolean
          default: true
        revision:
          type: integer
          readOnly: true
          description: >
            Monotonic per-object counter maintained by agrirouter. Never taken
            from the body: the revision a write was made from travels in the
            `x-agrirouter-base-revision` header, where it is compared and
            discarded.
        modifiedAt:
          type: string
          format: date-time
          readOnly: true
        tenantId:
          type: string
          format: uuid
          readOnly: true
          description: >
            The tenant the object belongs to. Assigned by agrirouter; a value
            sent by a participant is ignored. On send the tenant follows from
            the endpoint named in `x-agrirouter-endpoint-id`.


            One application stream carries every tenant the application is
            routed to, so on delivery this is the field that says which of them
            an object belongs to. A receiver holding data for several tenants
            partitions on it rather than on the connection.
        sourceEndpointId:
          type: string
          format: uuid
          readOnly: true
          description: >
            The agrirouter identifier of the endpoint whose change produced this
            revision. It always belongs to `tenantId`.


    Address:
      type: object
      properties:
        street:
          type: string
        poBox:
          type: string
        postalCode:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.
          pattern: '^[A-Z]{2}$'

    Contact:
      type: object
      properties:
        phone:
          type: string
        mobile:
          type: string
        email:
          type: string
          format: email

    HarvestPeriod:
      type: object
      description: >
        Canonical harvest period as an interval. A discrete year is mapped to an
        interval on send; `label` may round-trip the native presentation.
      properties:
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
          description: Absent means open / current.
        label:
          type: string
          description: 'Human-facing designation, e.g. "2026" or "2025/2026".'
      required: [validFrom]

    Organization:
      description: >
        A legal entity that may hold land and to which persons may belong. It
        plays no fixed role: whether it acts as a contractor or as a client
        follows from the relations it stands in, not from an attribute.
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/Party'
        - type: object
          properties:
            type:
              const: organization
              readOnly: true
              description: >
                Discriminator, set by agrirouter. Implied by the path on send.
            name:
              type: string
            commercialRegistryNumber:
              type: string
              description: Identifier from the commercial register.
          required: [type, name]

    Party:
      type: object
      description: >
        Attributes common to every party, whether an organization or a natural
        person. A farmer carries the fiscal identifiers as much as a company
        does; only the commercial register entry is specific to organizations.
      properties:
        address:
          $ref: '#/components/schemas/Address'
        contact:
          $ref: '#/components/schemas/Contact'
        billingAddress:
          $ref: '#/components/schemas/Address'
        taxNumber:
          type: string
          description: Identifier assigned by tax authorities.
        taxId:
          type: string
          description: Numerical identifier assigned by tax authorities.
        tradeId:
          type: string
          description: Numerical identifier assigned by public authorities.

    Person:
      description: >
        A natural person. A person may hold land, and may belong to one or more
        organizations through `memberships`.
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - $ref: '#/components/schemas/Party'
        - type: object
          properties:
            type:
              const: person
              readOnly: true
              description: >
                Discriminator, set by agrirouter. Implied by the path on send.
            title:
              type: string
            firstName:
              type: string
            lastName:
              type: string
            memberships:
              type: array
              description: >
                The organizations this person belongs to, each with the role
                held there. A person carrying at least one entry is a member.
              items:
                $ref: '#/components/schemas/Membership'
          required: [type, lastName]

    Membership:
      type: object
      description: A role held by a person in one organization.
      properties:
        organizationId:
          $ref: '#/components/schemas/EntityReference'
          description: The organization the person belongs to.
        memberRole:
          $ref: '#/components/schemas/Role'
      required: [organizationId, memberRole]

    Partner:
      type: object
      description: >
        A party holding a role on a farm — the contractor that works it, the
        advisor that reads it. Records a business relationship only. It does NOT
        grant visibility of the farm: what an endpoint receives is decided by
        opt-in and routing.
      properties:
        partnerId:
          $ref: '#/components/schemas/PartyReference'
          description: The organization or person acting as partner.
        partnerRole:
          $ref: '#/components/schemas/Role'
      required: [partnerId, partnerRole]

    Role:
      type: string
      description: >
        [Extensible enum](https://github.com/DKE-Data/masterdata-sync-working-group/blob/main/specification.md#extensible-enumerations).
        A role drawn from the ADAPT Role data type.
      examples:
        - UNKNOWN
        - AUTHORIZER
        - CROP_ADVISOR
        - CUSTOMER
        - CUSTOM_SERVICE_PROVIDER
        - DATA_SERVICES_PROVIDER
        - END_USER
        - FARM_MANAGER
        - FINANCIER
        - STATIONARY_ASSET_SUPPLIER
        - GOVERNMENT_AGENCY
        - GROWER
        - INPUT_SUPPLIER
        - INSURANCE_AGENT
        - IRRIGATION_MANAGER
        - LABORER
        - MARKET_ADVISOR
        - MARKET_PROVIDER
        - MOBILE_ASSET_SUPPLIER
        - OPERATOR
        - OWNER
        - TRANSPORTER

    Farm:
      description: >
        A grouping of fields that the farmer considers part of the same
        management group.
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              const: farm
              readOnly: true
              description: >
                Discriminator, set by agrirouter. Implied by the path on send.
            owner:
              $ref: '#/components/schemas/PartyReference'
              description: The organization or person that holds the farm.
            name:
              type: string
            specialisedUsageType:
              type: string
              description: >
                Production orientation of the farm (e.g. arable farming, dairy,
                vineyard, orchard). Free-form, drawn from AGROVOC where a
                matching concept exists.
            partners:
              type: array
              description: >
                Parties holding a role on this farm, such as the contractor that
                works it or the advisor that reads it.
              items:
                $ref: '#/components/schemas/Partner'
            address:
              $ref: '#/components/schemas/Address'
            geoReference:
              $ref: '#/components/schemas/Geometry'
              description: A GeoJSON Point (longitude, latitude) locating the farm.
          required: [type, owner, name]

    SoilInfo:
      type: object
      description: Soil characteristics of a field.
      properties:
        type:
          type: string
          description: >
            [Extensible enum](https://github.com/DKE-Data/masterdata-sync-working-group/blob/main/specification.md#extensible-enumerations).
            The soil classification.
          examples:
            - SAND
            - LOAMY_SAND
            - HEAVY_LOAMY_SAND
            - SANDY_TO_SILTY_LOAM
            - CLAYEY_LOAM
            - CLAY
        ratingPoints:
          type: integer
          minimum: 0
          maximum: 100
          description: >
            Soil rating points (Bodenzahl / Ackerzahl). Germany only, as defined
            by the [Bodenschätzungsgesetz](https://www.bundesfinanzministerium.de/Content/DE/Standardartikel/Themen/Steuern/Weitere_Steuerthemen/2014-07-21-bodenschaetzung-anlage-VRBodSchaetzG.pdf?__blob=publicationFile&v=1).

    Field:
      description: >
        A named physical space where production agriculture takes place, used
        to partition and identify data.
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              const: field
              readOnly: true
              description: >
                Discriminator, set by agrirouter. Implied by the path on send.
            name:
              type: string
            area:
              type: number
              description: Nominal area in square metres.
            farm:
              $ref: '#/components/schemas/EntityReference'
              description: The farm this field belongs to.
            owner:
              $ref: '#/components/schemas/PartyReference'
              description: >
                The organization or person holding this field, for systems that
                attribute fields to a party directly. When absent, the field is
                held by its farm's owner. When present, it takes precedence for
                this field, which is how a field held by one party but managed
                under another's farm is expressed.
            soil:
              $ref: '#/components/schemas/SoilInfo'
            topography:
              type: number
              description: 'Slope / gradient, e.g. 7 (degrees).'
            fieldBoundaries:
              type: array
              description: References to the field's boundaries.
              items:
                $ref: '#/components/schemas/EntityReference'
            harvestPeriod:
              $ref: '#/components/schemas/HarvestPeriod'
            metadata:
              type: object
              description: >
                Additional key/value metadata. Participants MUST preserve and relay
                metadata they do not understand.
              additionalProperties: true
          required: [type, name]

    Obstacle:
      type: object
      description: >
        A GeoJSON Feature describing an in-field obstacle whose geometry is a
        Point, LineString, or Polygon.
      properties:
        type:
          const: Feature
        geometry:
          $ref: '#/components/schemas/Geometry'
        properties:
          type: object
          properties:
            kind:
              type: string
              description: 'Obstacle kind, e.g. "pole", "tree", "waterhole".'
          required: [kind]
      required: [type, geometry, properties]

    FieldBoundary:
      description: >
        A geometry identifying the geo-spatial coordinates of a field, including
        its outer boundary and any obstacles left out. A field may have several
        boundaries that differ in geometry by intended use.
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              const: fieldBoundary
              readOnly: true
              description: >
                Discriminator, set by agrirouter. Implied by the path on send.
            boundary:
              $ref: '#/components/schemas/Geometry'
              description: A GeoJSON Polygon or MultiPolygon.
            boundaryType:
              type: string
              description: >
                [Extensible enum](https://github.com/DKE-Data/masterdata-sync-working-group/blob/main/specification.md#extensible-enumerations).
                The boundary classification.
              examples:
                - CONCEPTUAL
                - OPERATIONAL
                - ECONOMIC_DEFINED
                - ADMINISTRATIVE_RECEIVED
            creationMethod:
              type: string
              description: >
                [Extensible enum](https://github.com/DKE-Data/masterdata-sync-working-group/blob/main/specification.md#extensible-enumerations).
                How the boundary was produced.
              examples:
                - UNKNOWN
                - MANUAL
                - DRIVEN
                - SURVEYED
                - AUTO_OPERATION
                - AUTO_IMAGERY
                - ADMINISTRATIVE
            harvestPeriod:
              $ref: '#/components/schemas/HarvestPeriod'
            obstacles:
              type: array
              items:
                $ref: '#/components/schemas/Obstacle'
            regulatoryRequirements:
              type: string
              description: >
                [Extensible enum](https://github.com/DKE-Data/masterdata-sync-working-group/blob/main/specification.md#extensible-enumerations).
                A regulatory constraint applying to the boundary.
              examples:
                - RED_ZONE_NITROGEN
                - WATER_PROTECTION_AREA
            metadata:
              type: object
              description: >
                Additional key/value metadata. Participants MUST preserve and relay
                metadata they do not understand.
              additionalProperties: true
          required: [type, boundary]

    Entity:
      description: >
        Any master-data entity. Used only on the event stream, which carries every
        opted-in entity type over a single connection; the typed resources use the
        concrete schemas directly.
      oneOf:
        - $ref: '#/components/schemas/Organization'
        - $ref: '#/components/schemas/Person'
        - $ref: '#/components/schemas/Farm'
        - $ref: '#/components/schemas/Field'
        - $ref: '#/components/schemas/FieldBoundary'
      discriminator:
        propertyName: type
        mapping:
          organization: '#/components/schemas/Organization'
          person: '#/components/schemas/Person'
          farm: '#/components/schemas/Farm'
          field: '#/components/schemas/Field'
          fieldBoundary: '#/components/schemas/FieldBoundary'
    Geometry:
      type: object
      description: >
        A GeoJSON geometry (RFC 7946). Positions are [longitude, latitude] and,
        optionally, altitude.
      properties:
        type:
          type: string
          description: >
            [Extensible enum](https://github.com/DKE-Data/masterdata-sync-working-group/blob/main/specification.md#extensible-enumerations).
            The GeoJSON geometry type.
          examples: [Point, LineString, Polygon, MultiPolygon]
        coordinates:
          description: Nesting depth depends on `type`.
      required: [type, coordinates]

    EntityTypeToggle:
      type: object
      properties:
        entityType:
          type: string
          description: >
            [Extensible enum](https://github.com/DKE-Data/masterdata-sync-working-group/blob/main/specification.md#extensible-enumerations).
            The entity type this toggle applies to.
          examples: [organizations, persons, farms, fields, field-boundaries]
      required: [entityType]

    MasterdataConfig:
      type: object
      description: >
        Per-endpoint, per-entity opt-in for master-data exchange. Absence of a
        toggle for an entity type means the endpoint is not opted in for it.
      properties:
        endpointId:
          type: string
          format: uuid
          readOnly: true
          description: >
            The agrirouter identifier of the endpoint this resource belongs to.
            The path addresses it by the participant's own `externalEndpointId`.
        toggles:
          type: array
          items:
            $ref: '#/components/schemas/EntityTypeToggle'
        resolutionUrl:
          type: string
          format: uri
          description: >
            Where the user resolves initial-load conflicts in the endpoint's own
            software. Optional, opaque to agrirouter, and not per conflict: it is
            rendered as a link while the endpoint has `awaitingUser` set.
          examples: ['https://app.example.com/tenants/42/agrirouter/masterdata']
      required: [toggles]

    EndpointSelectionChangedEventData:
      type: object
      description: >
        Data structure for `ENDPOINT_SELECTION_CHANGED` events on
        `/masterdata/events`. It states which entity types the user has selected
        for one of the application's endpoints.

        It is a statement of the selection rather than of a transition, which is
        why one event covers every way the selection moves: the endpoint routed
        to the master-data hub for the first time, a further entity type selected
        on one already routed, a type deselected, and the last one deselected or
        the route removed, which is an empty `entityTypes`. An application does
        not have to tell those apart to act on it: it applies the selection it is
        given, replacing whatever it held for that endpoint.

        **This event is the only place the selection is exposed.** agrirouter
        records it when the user routes the endpoint to the hub, and no operation
        returns it, so an application that was not told it here has no way to read
        it. What `masterdata-config` holds is the application's own declaration,
        a superset of this.

        On catch-up agrirouter emits one for every endpoint of the application
        that has a selection, and one for every endpoint whose selection was
        emptied. The second is what makes a withdrawal survive a disconnection:
        an emptied endpoint has nothing to restate, so without it an application
        that was offline when its user withdrew would simply never hear again and
        would go on believing it was opted in.
      required: [eventType, endpointId, externalEndpointId, entityTypes]
      properties:
        eventType:
          type: string
          const: ENDPOINT_SELECTION_CHANGED
          description: Discriminator; matches the `event:` line.
        endpointId:
          type: string
          format: uuid
          description: >
            The agrirouter identifier of the endpoint. This is the id the
            application names as the acting endpoint on the writes that follow
            (`x-agrirouter-endpoint-id`).
        externalEndpointId:
          type: string
          description: >
            The application's own identifier for the same endpoint. Carried
            alongside the agrirouter id because the two sides of this API are
            addressed differently and the application needs whichever it is about
            to use: the initial-load and configuration resources are addressed
            by `externalEndpointId`.
        entityTypes:
          type: array
          description: >
            Complete current selection for this endpoint. Replaces any cached
            selection, do not merge.

            Always a subset of what the endpoint declared, and dependency-closed.
            Empty means the endpoint exchanges nothing: the user deselected the
            last type or removed the route to the hub. The application stops
            sending for it and may tell its user that exchange has ended. What is
            not discarded is the canonical objects or the identifier mapping, so
            a later reselection is a matched repeat rather than a fresh start.
          items:
            $ref: '#/components/schemas/EntityTypeToggle'
        changedAt:
          type: string
          format: date-time
          description: >
            When the selection last changed. On an event emitted during catch-up
            this is that time, not the time of the catch-up.

    InitialLoadState:
      type: string
      description: >
        Per-endpoint initial-load state, covering every entity type the
        endpoint is opted into.


        `LOADING_FROM_AGRIROUTER` — agrirouter is still sending the canonical set.
        Entered when the user selects the endpoint's first entity type, and again
        whenever a further entity type is selected. Both are a user's opt-in
        decision carried out by agrirouter, and the application is told of them
        by `ENDPOINT_SELECTION_CHANGED` on `/masterdata/events`. A participant cannot
        enter this state directly — neither by adding a type to its declaration,
        which enables nothing, nor by setting it on the `status` resource, which
        is a `409`.


        `RECONCILING` — the whole canonical set has been delivered and the
        initial-load stream closed. agrirouter moves the endpoint here itself,
        and only this one,
        because it is the side that knows it has finished sending, which is also
        why this state is the authoritative answer to whether the set arrived: an
        endpoint cannot tell an orderly close from a dropped connection. The
        endpoint is now working through whatever conflicts reconciling surfaced,
        which may take as long as a user takes.


        `LOADING_TO_AGRIROUTER` — the endpoint has confirmed it reconciled, and is
        sending the objects it holds that the canonical set did not contain.


        `COMPLETED` — steady-state synchronization applies.


        The endpoint drives two of these transitions, both through the
        `status` resource: `RECONCILING` → `LOADING_TO_AGRIROUTER` and
        `LOADING_TO_AGRIROUTER` → `COMPLETED`.
      enum:
        - LOADING_FROM_AGRIROUTER
        - RECONCILING
        - LOADING_TO_AGRIROUTER
        - COMPLETED

    InitialLoadStatus:
      type: object
      description: >
        The endpoint's initial-load state. One per endpoint, covering every
        entity type it is opted into; an endpoint opted into no entity type has
        no initial-load state.
      properties:
        endpointId:
          type: string
          format: uuid
          readOnly: true
          description: >
            The agrirouter identifier of the endpoint this resource belongs to.
            The path addresses it by the participant's own `externalEndpointId`.
        state:
          $ref: '#/components/schemas/InitialLoadState'
        awaitingUser:
          type: boolean
          readOnly: true
          description: >
            Whether the endpoint's own software is needing user action
            — a conflict, a missing required
            attribute, a granularity mismatch. Raised by the endpoint through the
            `user-attention` resource and cleared by agrirouter, on the two
            endpoint-driven transitions only: advancing
            to `LOADING_TO_AGRIROUTER` clears it, and so does advancing to
            `COMPLETED`. The step to `RECONCILING` does not, since that is
            agrirouter reporting it has finished sending and says nothing about
            whether the user has finished deciding. agrirouter renders the flag as
            "waiting for you in <app>", linking to the master-data resolution URI
            supplied for this endpoint.
        previousLoadCompletedAt:
          type: string
          format: date-time
          readOnly: true
          description: >
            When this endpoint last reached `COMPLETED`, present only if it
            has. Its presence means the canonical set now arriving is a repeat
            load — the endpoint was a participant before and has returned, having
            been deselected, disconnected from the hub, or had a further
            entity type selected on it. Each of those is the user's act: an
            application cannot ask for the set again. The identifier mapping
            survived all of them, so the objects
            arrive carrying the endpoint's own `localId` and match rather than
            reconcile. An endpoint MUST NOT take the arrival of a canonical set as
            evidence of a first connection: without this check it creates local
            duplicates of data it already holds.
        rejectedIdMappings:
          type: array
          readOnly: true
          description: >
            Bindings supplied on this request that could not be recorded, each
            with its `reason` and, where one exists, the mapping that stands in
            its way. They do not fail the transition: one unresolvable pair
            should not block the load of a set. The endpoint resolves them as it
            resolves a `409` on the per-entity operation, and rebinds through
            that operation once it has. Recomputed on every request that carries
            `idMappings`, including a repeat of the transition, so a retry after
            a lost response reports the current outcome rather than the first.
          items:
            $ref: '#/components/schemas/IdMappingRejection'
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required: [state]

    InitialLoadStateUpdate:
      type: object
      description: >
        The target initial-load `state` for the endpoint. The states are
        accepted in order, and repeating the one the endpoint is already in is
        accepted too. `LOADING_FROM_AGRIROUTER` is never a transition an
        endpoint may make, from any state including from itself.
      properties:
        state:
          $ref: '#/components/schemas/InitialLoadState'
        idMappings:
          type: array
          description: >
            The bindings reconciliation produced: one entry per canonical object
            the endpoint matched to something it already held. Carried here
            because matching happens over a whole set, and the semantics are those
            of the per-entity `id-mapping` operation applied to each pair. Meaningful
            only on the transition to `LOADING_TO_AGRIROUTER`, which is where
            reconciliation is asserted to be done, and on a repeat of that
            transition, where the pairs are applied again and the rejections
            recomputed. Pairs are applied
            independently: any that cannot be recorded — because an identifier is
            already bound, because the canonical object is unknown to the
            endpoint, or because the request names the same identifier twice —
            come back in `rejectedIdMappings` rather than failing the transition.
          items:
            $ref: '#/components/schemas/IdMappingBinding'
      required: [state]
